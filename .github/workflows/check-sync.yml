name: check-sync

# Fails the build when chrome/shared or firefox/shared has drifted from the
# repo-root shared/ source. The local .githooks/pre-commit hook only advises;
# this is the un-bypassable gate on push and pull_request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # check-sync.mjs imports only node builtins, so no npm install is needed.
      # A non-zero exit (the drift path) fails the job.
      - run: node scripts/check-sync.mjs
