name: ci

# The pre-commit hook only runs where core.hooksPath is set, so this is the
# gate that always runs: shared/ sync, unit tests, and web-ext lint.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-sync
      - run: npm test
      - run: npm run lint:chrome
      - run: npm run lint:firefox
